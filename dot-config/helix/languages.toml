[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]

[language-server.yaml-language-server.config.yaml]
format = { enable = true }
validation = true

[language-server.ansible-language-server]
command = "ansible-language-server"
args = ["--stdio"]

[language-server.marksman]
command = "marksman"

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.ruff]
command = "ruff"
args = ["server"]
environment = { "RUFF_TRACE" = "messages" }

[language-server.ruff.config.settings.format]
preview = true

[language-server.pylsp.config.plugins]
plugins.pylsp_mypy.enabled = true
plugins.pylsp_mypy.live_mode = true

[language-server.gopls]
command = "gopls"

[language-server.gopls.config.hints]
assignVeriableType = true
compositeLiteralFields = true
compositeLiteralTypes = true
constantValues = true
functionTypeParameters = true
parameterNames = true
rangeVariableTypes = true

[language-server.gopls.config.analyses]
fieldalignment = true
nilness = true
unusedparams = true
unusedwrite = true
useany = true

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.vacuum]
command = "vacuum"
arcg = ["language-server"]

[language-server.jinja-lsp]
command = "jinja-lsp"

[language-server.esbonio]
command = "esbonio"
args = ["server"]

[language-server.tinymist]
command = "tinymist"

[langiage-server.sqls]
command = "sqls"

[langiage-server.gopls.config]
gofumpt = true
semanticTokens = true
staticcheck = true
verboseOutput = true
usePLaceholders = true
completeUnimported = true

[[language]]
name = "yaml"
indent = { tab-width = 2, unit = "  " }
auto-format = true
formatter = { command = "prettier", args = ["--parser", "yaml"] }
[[language]]
name = "sql"
indent = { tab-width = 4, unit = "    " }
language-servers = ["sqls"]

[[language]]
name = "markdown"
language-servers = ["marksman", "codebook"]
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"] }
soft-wrap = { enable = true }
text-width = 120
auto-format = true
rulers = [120]

[[language]]
name = "rust"

[language.debugger]
name = "lldb-vscode"
transport = "stdio"
command = "lldb-vscode"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [{ name = "binary", completion = "filename" }]
args = { program = "{0}", initCommands = [
  "command script import /usr/local/etc/lldb_vscode_rustc_primer.py"
] }

[[language]]
rulers = [88]
name = "python"
scope = "source.python"
injection-regex = "python"
file-types = [
  "py",
  "pyi",
  "py3",
  "pyw",
  "ptl",
  "rpy",
  "cpy",
  "ipy",
  "pyt",
  { glob = ".python_history" },
  { glob = ".pythonstartup" },
  { glob = ".pythonrc" },
  { glob = "SConstruct" },
  { glob = "SConscript" }
]
shebangs = ["python"]
roots = [
  "pyproject.toml",
  "setup.py",
  "poetry.lock",
  "uv.lock",
  "pyrightconfig.json",
  "requirements.txt",
  ".venv/"
]
language-servers = [
  { name = "pyright", except-features = ["diagnostics"] },
  "pylsp",
  "ruff",
  "ty",
  "codebook"
]
auto-format = true
formatter = { command = "bash", args = [
  "-c",
  "ruff check --select I --fix - | ruff format -"
] }

[[language]]
name = "json"
language-servers = [
  { name = "vscode-json-language-server", except-features = ["format"] },
  "biome",
  "vacuum"
]
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "go"
roots = ["go.work", "go.mod"]
auto-format = true
comment-token = "//"
formatter = { command = "goimports" }
language-servers = ["gopls"]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server", "ansible-language-server"]

[[language]]
name = "jinja"
file-types = ["j2", "jinja2", "jinja"]
language-servers = ["jinja-lsp"]

[[language]]
name = "rst"
file-types = ["rst"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["esbonio", "codebook"]
auto-format = true
rulers = [120]

[[language]]
name = "toml"
auto-format = true
formatter = { command = "tombi", args = ["format", "-"] }

[[language]]
name = "typst"
language-servers = ["tinymist"]
